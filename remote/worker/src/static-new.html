<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>commute.kimiflare.com</title>
  <link rel="stylesheet" href="/xterm.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #000;
      color: #fff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #app { flex: 1; display: flex; flex-direction: column; }
    .landing {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      padding: 2rem;
      text-align: center;
    }
    .landing h1 { font-size: 2rem; font-weight: 600; margin-bottom: 0.5rem; }
    .landing p { color: #888; margin-bottom: 2rem; font-size: 1rem; }
    .btn {
      display: inline-flex; align-items: center; gap: 0.5rem;
      padding: 0.75rem 1.5rem; border-radius: 6px; border: 1px solid #fff;
      background: #000; color: #fff; font-size: 1rem; font-weight: 500;
      cursor: pointer; transition: all 0.2s;
    }
    .btn:hover { background: #fff; color: #000; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; border-color: #444; color: #444; }
    .repo-picker {
      flex: 1; display: flex; flex-direction: column;
      padding: 1rem; max-width: 640px; width: 100%; margin: 0 auto;
    }
    .repo-picker h2 { font-size: 1.25rem; margin-bottom: 1rem; }
    .search-box {
      width: 100%; padding: 0.75rem 1rem; border-radius: 6px;
      border: 1px solid #333; background: #111; color: #fff;
      font-size: 1rem; margin-bottom: 1rem;
    }
    .search-box:focus { outline: none; border-color: #fff; }
    .repo-list { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .repo-item {
      padding: 0.875rem 1rem; border-radius: 6px; cursor: pointer;
      transition: background 0.15s; border-bottom: 1px solid #1a1a1a;
    }
    .repo-item:hover { background: #111; }
    .repo-item .name { font-weight: 500; }
    .repo-item .meta { font-size: 0.8125rem; color: #666; margin-top: 0.25rem; }
    .repo-item .private-badge {
      display: inline-block; padding: 0.125rem 0.375rem; border-radius: 4px;
      background: #333; color: #fff; font-size: 0.6875rem; margin-left: 0.5rem;
    }
    .session-list { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .session-item {
      padding: 0.875rem 1rem; border-radius: 6px; cursor: pointer;
      transition: background 0.15s; border-bottom: 1px solid #1a1a1a;
      display: flex; align-items: center; gap: 0.75rem;
    }
    .session-item:hover { background: #111; }
    .session-info { flex: 1; }
    .session-info .prompt { font-weight: 500; font-size: 0.9375rem; }
    .session-info .meta { font-size: 0.8125rem; color: #666; }
    .log-view {
      flex: 1; display: flex; flex-direction: column;
      padding: 1rem; max-width: 720px; width: 100%; margin: 0 auto;
    }
    .log-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 1rem; padding-bottom: 0.75rem; border-bottom: 1px solid #222;
    }
    .log-header h2 { font-size: 1rem; font-weight: 500; }
    .log-header .repo { color: #888; font-size: 0.875rem; }
    .log-list { flex: 1; overflow-y: auto; font-family: 'SF Mono', Monaco, 'Cascadia Code', monospace; }
    .log-step {
      border-bottom: 1px solid #111; cursor: pointer; transition: background 0.1s;
    }
    .log-step:hover { background: #0a0a0a; }
    .log-step-header {
      display: flex; align-items: center; gap: 0.75rem;
      padding: 0.625rem 0.5rem;
    }
    .step-dot {
      width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
      background: #333; transition: background 0.3s;
    }
    .step-dot.pending { background: #333; }
    .step-dot.running { background: #f5a623; animation: pulse 1.2s infinite; }
    .step-dot.success { background: #3fb950; }
    .step-dot.error { background: #f85149; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
    .step-label { flex: 1; font-size: 0.875rem; }
    .step-status { font-size: 0.75rem; color: #666; }
    .step-detail {
      padding: 0.5rem 0.5rem 0.75rem 2rem;
      font-size: 0.8125rem; color: #888; line-height: 1.5;
      white-space: pre-wrap; word-break: break-word;
      display: none;
    }
    .log-step.expanded .step-detail { display: block; }
    .log-step.expanded { background: #0a0a0a; }
    .terminal-container {
      flex: 1; display: flex; flex-direction: column; position: relative;
    }
    .terminal-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.5rem 1rem; background: #111; border-bottom: 1px solid #222;
      font-size: 0.875rem;
    }
    .terminal-header .repo { color: #888; }
    #terminal { flex: 1; padding: 0.5rem; }
    .terminal-toolbar {
      display: flex; gap: 0.5rem; padding: 0.5rem;
      background: #111; border-top: 1px solid #222; overflow-x: auto;
    }
    .toolbar-btn {
      padding: 0.5rem 0.75rem; border-radius: 6px; border: 1px solid #333;
      background: #000; color: #fff; font-size: 0.875rem; cursor: pointer;
    }
    .toolbar-btn:hover { background: #111; }
    .connect-banner {
      padding: 1rem; text-align: center; border-bottom: 1px solid #222;
    }
    .connect-banner .btn { width: 100%; max-width: 300px; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module">
    const API_BASE = '';
    let currentUser = null;
    let currentSession = null;
    let terminal = null;
    let terminalAddon = null;
    let eventSource = null;

    const STEPS = [
      { id: 'api_call', label: 'POST /api/sessions' },
      { id: 'd1_create', label: 'Create session record in D1' },
      { id: 'artifacts_import', label: 'Import repository to Artifacts' },
      { id: 'artifacts_token', label: 'Create Artifacts write token' },
      { id: 'sandbox_get', label: 'Get Sandbox DO stub' },
      { id: 'sandbox_provision', label: 'Provision container' },
      { id: 'git_config', label: 'Write git config' },
      { id: 'git_clone', label: 'Clone repository from Artifacts' },
      { id: 'git_remote', label: 'Add GitHub remote' },
      { id: 'git_branch', label: 'Create and checkout branch' },
      { id: 'session_ready', label: 'Session ready' },
    ];

    function renderLanding() {
      app.innerHTML = '<div class="landing"><h1>commute</h1><p>KimiFlare on your phone. Anywhere.</p><button class="btn" id="login-btn"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>Log in with GitHub</button></div>';
      document.getElementById('login-btn').addEventListener('click', () => { window.location.href = '/auth/github'; });
    }

    async function renderHome() {
      app.innerHTML = '<div class="repo-picker"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;"><h2>' + currentUser.login + '</h2><button class="btn" id="logout-btn" style="padding:0.5rem 1rem;font-size:0.875rem;">Log out</button></div><input type="text" class="search-box" id="repo-search" placeholder="Search repositories..."><div class="repo-list" id="repo-list"></div><div style="margin-top:1rem;padding-top:1rem;border-top:1px solid #1a1a1a;"><h3 style="font-size:0.875rem;margin-bottom:0.75rem;color:#666;">Recent sessions</h3><div class="session-list" id="session-list"></div></div></div>';
      document.getElementById('logout-btn').addEventListener('click', async () => { await fetch('/auth/logout', { method: 'POST', credentials: 'include' }); currentUser = null; renderLanding(); });
      const repoList = document.getElementById('repo-list');
      const searchInput = document.getElementById('repo-search');
      let allRepos = [];
      try { const res = await fetch('/api/repos', { credentials: 'include' }); const data = await res.json(); allRepos = data.repos ?? []; renderRepos(allRepos); } catch (err) { repoList.innerHTML = '<div style="padding:1rem;color:#f85149;">Failed to load repos</div>'; }
      searchInput.addEventListener('input', (e) => { const q = e.target.value.toLowerCase(); renderRepos(allRepos.filter((r) => r.full_name.toLowerCase().includes(q))); });
      function renderRepos(repos) {
        repoList.innerHTML = repos.map((r) => '<div class="repo-item" data-owner="' + r.owner.login + '" data-name="' + r.name + '"><div class="name">' + r.full_name + (r.private ? '<span class="private-badge">Private</span>' : '') + '</div><div class="meta">' + (r.description || 'No description') + ' \u00b7 \u2b50 ' + (r.stargazers_count ?? 0) + '</div></div>').join('');
        repoList.querySelectorAll('.repo-item').forEach((el) => { el.addEventListener('click', () => { const owner = el.dataset.owner; const name = el.dataset.name; const p = prompt('What should KimiFlare do in ' + owner + '/' + name + '?'); if (p) startSession(owner, name, p); }); });
      }
      try { const res = await fetch('/api/sessions', { credentials: 'include' }); const data = await res.json(); const sessions = data.sessions ?? []; const list = document.getElementById('session-list'); if (sessions.length === 0) { list.innerHTML = '<div style="padding:0.5rem;color:#444;font-size:0.875rem;">No sessions yet</div>'; } else { list.innerHTML = sessions.slice(0, 10).map((s) => '<div class="session-item" data-id="' + s.id + '"><div class="session-info"><div class="prompt">' + s.prompt.slice(0, 60) + (s.prompt.length > 60 ? '...' : '') + '</div><div class="meta">' + s.repo_owner + '/' + s.repo_name + ' \u00b7 ' + s.status + '</div></div></div>').join(''); list.querySelectorAll('.session-item').forEach((el) => { el.addEventListener('click', () => loadSession(el.dataset.id)); }); } } catch { document.getElementById('session-list').innerHTML = '<div style="padding:0.5rem;color:#444;font-size:0.875rem;">Failed to load sessions</div>'; }
    }

    async function startSession(owner, name, prompt) {
      const repo = { owner, name };
      renderLogView(repo, prompt);
      updateStep('api_call', 'running', 'Sending request...');
      let streamUrl, terminalUrl;
      try {
        const res = await fetch('/api/sessions', { method: 'POST', credentials: 'include', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ prompt, repo }) });
        const data = await res.json();
        if (!res.ok) { updateStep('api_call', 'error', 'HTTP ' + res.status, data.error || 'Unknown error'); return; }
        updateStep('api_call', 'success', 'HTTP ' + res.status + ' \u2014 session ' + data.sessionId.slice(0, 8) + '...');
        streamUrl = data.streamUrl; terminalUrl = data.terminalUrl;
      } catch (err) { updateStep('api_call', 'error', 'Network error', err.message); return; }
      connectEventSource(streamUrl, terminalUrl);
    }

    function renderLogView(repo, prompt) {
      app.innerHTML = '<div class="log-view"><div class="log-header"><div><h2>' + repo.owner + '/' + repo.name + '</h2><div class="repo">' + prompt.slice(0, 80) + (prompt.length > 80 ? '...' : '') + '</div></div><button class="btn" id="back-btn" style="padding:0.5rem 1rem;font-size:0.875rem;">Back</button></div><div class="log-list" id="log-list">' + STEPS.map((s) => '<div class="log-step" data-step="' + s.id + '" id="step-' + s.id + '"><div class="log-step-header"><div class="step-dot pending" id="dot-' + s.id + '"></div><div class="step-label" id="label-' + s.id + '">' + s.label + '</div><div class="step-status" id="status-' + s.id + '">pending</div></div><div class="step-detail" id="detail-' + s.id + '"></div></div>').join('') + '</div><div id="connect-area"></div></div>';
      document.getElementById('back-btn').addEventListener('click', () => { if (eventSource) { eventSource.close(); eventSource = null; } renderHome(); });
      document.querySelectorAll('.log-step').forEach((el) => { el.addEventListener('click', (e) => { if (e.target.closest('.step-detail')) return; el.classList.toggle('expanded'); }); });
    }

    function updateStep(stepId, status, message, detail) {
      const dot = document.getElementById('dot-' + stepId);
      const label = document.getElementById('label-' + stepId);
      const statusEl = document.getElementById('status-' + stepId);
      const detailEl = document.getElementById('detail-' + stepId);
      if (!dot || !label || !statusEl) return;
      dot.className = 'step-dot ' + status;
      label.textContent = message;
      statusEl.textContent = status;
      if (detail) { detailEl.textContent = typeof detail === 'string' ? detail : JSON.stringify(detail, null, 2); document.getElementById('step-' + stepId)?.classList.add('expanded'); }
    }

    function connectEventSource(streamUrl, terminalUrl) {
      if (eventSource) eventSource.close();
      eventSource = new EventSource(API_BASE + streamUrl);
      eventSource.onmessage = (e) => {
        let data;
        try { data = JSON.parse(e.data); } catch { return; }
        if (data.type === 'step') {
          updateStep(data.step, data.status, data.message, data.detail);
          if (data.attempt && data.maxAttempts) { const statusEl = document.getElementById('status-' + data.step); if (statusEl) statusEl.textContent = 'attempt ' + data.attempt + '/' + data.maxAttempts; }
          if (data.status === 'success' && data.durationMs) { const statusEl = document.getElementById('status-' + data.step); if (statusEl) statusEl.textContent = data.durationMs + 'ms'; }
        }
        if (data.type === 'step' && data.step === 'session_ready' && data.status === 'success') { showConnectButton(terminalUrl); }
      };
      eventSource.onerror = () => {};
    }

    function showConnectButton(terminalUrl) {
      const area = document.getElementById('connect-area');
      if (!area) return;
      area.innerHTML = '<div class="connect-banner"><button class="btn" id="connect-btn">Connect to terminal</button></div>';
      document.getElementById('connect-btn').addEventListener('click', () => { renderTerminal(currentSession?.repo || { owner: '?', name: '?' }, terminalUrl); });
    }

    async function loadSession(sessionId) {
      try {
        const res = await fetch('/api/sessions/' + sessionId, { credentials: 'include' });
        const data = await res.json();
        if (data.error) return;
        currentSession = data;
        if (data.status === 'idle' || data.status === 'running') {
          renderLogView(data.repo, data.prompt);
          connectEventSource(data.streamUrl || '/api/sessions/' + sessionId + '/stream', data.terminalUrl || '/api/sessions/' + sessionId + '/terminal');
        } else {
          renderTerminal(data.repo, '/api/sessions/' + sessionId + '/terminal');
        }
      } catch {}
    }

    async function renderTerminal(repo, terminalUrl) {
      app.innerHTML = '<div class="terminal-container"><div class="terminal-header"><span class="repo">' + repo.owner + '/' + repo.name + '</span><span class="status" id="term-status">Connecting...</span></div><div id="terminal"></div><div class="terminal-toolbar"><button class="toolbar-btn" id="btn-done">Done</button><button class="toolbar-btn" id="btn-cancel">Cancel</button><button class="toolbar-btn" id="btn-back">Back</button></div></div>';
      const { Terminal } = await import('/xterm.js');
      const { FitAddon } = await import('/xterm-addon-fit.js');
      terminal = new Terminal({ fontSize: 14, fontFamily: 'monospace', theme: { background: '#000', foreground: '#fff' } });
      terminalAddon = new FitAddon();
      terminal.loadAddon(terminalAddon);
      terminal.open(document.getElementById('terminal'));
      terminalAddon.fit();
      const ws = new WebSocket('wss://' + location.host + terminalUrl);
      ws.onopen = () => { document.getElementById('term-status').textContent = 'Connected'; };
      ws.onclose = () => { document.getElementById('term-status').textContent = 'Disconnected'; };
      ws.onerror = () => { document.getElementById('term-status').textContent = 'Error'; };
      ws.onmessage = (e) => { if (typeof e.data === 'string') terminal.write(e.data); else { const reader = new FileReader(); reader.onload = () => terminal.write(reader.result); reader.readAsText(e.data); } };
      terminal.onData((d) => { if (ws.readyState === WebSocket.OPEN) ws.send(d); });
      document.getElementById('btn-done').addEventListener('click', async () => { await fetch('/api/sessions/' + (currentSession?.sessionId || '') + '/finalize', { method: 'POST', credentials: 'include', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ summary: 'Done via UI', commitCount: 0 }) }); ws.close(); renderHome(); });
      document.getElementById('btn-cancel').addEventListener('click', async () => { await fetch('/api/sessions/' + (currentSession?.sessionId || '') + '/cancel', { method: 'POST', credentials: 'include' }); ws.close(); renderHome(); });
      document.getElementById('btn-back').addEventListener('click', () => { ws.close(); renderHome(); });
    }

    (async () => {
      try {
        const res = await fetch('/api/me', { credentials: 'include' });
        if (res.ok) { currentUser = await res.json(); renderHome(); }
        else { renderLanding(); }
      } catch { renderLanding(); }
    })();
  </script>
</body>
</html>
