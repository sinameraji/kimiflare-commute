name = "kimiflare-commute"
main = "src/index.ts"
compatibility_date = "2025-05-06"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Durable Objects
[[durable_objects.bindings]]
name = "SESSION_DO"
class_name = "SessionDO"

[[durable_objects.bindings]]
name = "SANDBOX"
class_name = "KimiSandbox"

# Containers (Sandbox)
[[containers]]
class_name = "KimiSandbox"
image = "./Dockerfile"
instance_type = "basic"
max_instances = 5

# Artifacts binding
[[artifacts]]
binding = "ARTIFACTS"
namespace = "default"

# KV for OAuth state and session caching
[[kv_namespaces]]
binding = "OAUTH_KV"
id = "4c23fe928c814a01b0384b58330eff3f"

# Secrets (set via wrangler secret put)
# GITHUB_OAUTH_CLIENT_ID
# GITHUB_OAUTH_CLIENT_SECRET
# ENCRYPTION_KEY
