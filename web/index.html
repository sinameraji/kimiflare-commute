<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>commute.kimiflare.com</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #app { flex: 1; display: flex; flex-direction: column; }

    /* Landing */
    .landing {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      padding: 2rem;
      text-align: center;
    }
    .landing h1 {
      font-size: 2rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: #58a6ff;
    }
    .landing p {
      color: #8b949e;
      margin-bottom: 2rem;
      font-size: 1rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      border: none;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
    .btn-primary {
      background: #238636;
      color: white;
    }
    .btn-secondary {
      background: #21262d;
      color: #c9d1d9;
      border: 1px solid #30363d;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Repo picker */
    .repo-picker {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 1rem;
      max-width: 600px;
      width: 100%;
      margin: 0 auto;
    }
    .repo-picker h2 {
      font-size: 1.25rem;
      margin-bottom: 1rem;
    }
    .search-box {
      width: 100%;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      border: 1px solid #30363d;
      background: #21262d;
      color: #c9d1d9;
      font-size: 1rem;
      margin-bottom: 1rem;
    }
    .search-box:focus { outline: none; border-color: #58a6ff; }
    .repo-list {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .repo-item {
      padding: 0.875rem 1rem;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s;
      border-bottom: 1px solid #21262d;
    }
    .repo-item:hover { background: #161b22; }
    .repo-item .name { font-weight: 500; color: #c9d1d9; }
    .repo-item .meta { font-size: 0.8125rem; color: #8b949e; margin-top: 0.25rem; }
    .repo-item .private-badge {
      display: inline-block;
      padding: 0.125rem 0.375rem;
      border-radius: 4px;
      background: #da3633;
      color: white;
      font-size: 0.6875rem;
      margin-left: 0.5rem;
    }

    /* Session list */
    .session-list {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .session-item {
      padding: 0.875rem 1rem;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s;
      border-bottom: 1px solid #21262d;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .session-item:hover { background: #161b22; }
    .session-icon { font-size: 1.25rem; }
    .session-info { flex: 1; }
    .session-info .prompt { font-weight: 500; }
    .session-info .meta { font-size: 0.8125rem; color: #8b949e; }

    /* Terminal */
    .terminal-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .terminal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.5rem 1rem;
      background: #161b22;
      border-bottom: 1px solid #30363d;
      font-size: 0.875rem;
    }
    .terminal-header .repo { color: #58a6ff; }
    .terminal-header .status {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    .status-dot.idle { background: #8b949e; }
    .status-dot.running { background: #58a6ff; animation: pulse 1.5s infinite; }
    .status-dot.done { background: #238636; }
    .status-dot.error { background: #da3633; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    #terminal {
      flex: 1;
      padding: 0.5rem;
    }
    .terminal-toolbar {
      display: flex;
      gap: 0.5rem;
      padding: 0.5rem;
      background: #161b22;
      border-top: 1px solid #30363d;
      overflow-x: auto;
    }
    .toolbar-btn {
      padding: 0.5rem 0.75rem;
      border-radius: 6px;
      border: 1px solid #30363d;
      background: #21262d;
      color: #c9d1d9;
      font-size: 0.875rem;
      cursor: pointer;
    }
    .toolbar-btn:active { background: #30363d; }

    /* Loading */
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 1;
      flex-direction: column;
      gap: 1rem;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #30363d;
      border-top-color: #58a6ff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Setup progress */
    .setup-log {
      font-family: 'SF Mono', Monaco, monospace;
      font-size: 0.875rem;
      line-height: 1.6;
      padding: 1rem;
      max-width: 600px;
      width: 100%;
      margin: 0 auto;
    }
    .setup-log .line {
      padding: 0.25rem 0;
      opacity: 0;
      animation: fadeIn 0.3s forwards;
    }
    .setup-log .line.done { color: #3fb950; }
    .setup-log .line.pending { color: #8b949e; }
    .setup-log .line.error { color: #f85149; }
    @keyframes fadeIn { to { opacity: 1; } }
  </style>
</head>
<body>
  <div id="app"></div>

  <script type="module">
    const API_BASE = ''; // Same origin

    // ── State ─────────────────────────────────────────────────────────
    let currentUser = null;
    let currentSession = null;
    let terminal = null;
    let terminalAddon = null;

    // ── App ───────────────────────────────────────────────────────────
    const app = document.getElementById('app');

    function renderLanding() {
      app.innerHTML = `
        <div class="landing">
          <h1>�� commute</h1>
          <p>KimiFlare on your phone. Anywhere.</p>
          <button class="btn btn-primary" id="login-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
            Log in with GitHub
          </button>
        </div>
      `;
      document.getElementById('login-btn').addEventListener('click', () => {
        window.location.href = '/auth/github';
      });
    }

    async function renderHome() {
      app.innerHTML = `
        <div class="repo-picker">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;">
            <h2>�� ${currentUser.login}</h2>
            <button class="btn btn-secondary" id="logout-btn" style="padding:0.5rem 1rem;font-size:0.875rem;">Log out</button>
          </div>
          <input type="text" class="search-box" id="repo-search" placeholder="Search repositories...">
          <div class="repo-list" id="repo-list"></div>
          <div style="margin-top:1rem;padding-top:1rem;border-top:1px solid #30363d;">
            <h3 style="font-size:1rem;margin-bottom:0.75rem;color:#8b949e;">Recent sessions</h3>
            <div class="session-list" id="session-list"></div>
          </div>
        </div>
      `;

      document.getElementById('logout-btn').addEventListener('click', async () => {
        await fetch('/auth/logout', { method: 'POST', credentials: 'include' });
        currentUser = null;
        renderLanding();
      });

      // Load repos
      const repoList = document.getElementById('repo-list');
      const searchInput = document.getElementById('repo-search');
      let allRepos = [];

      try {
        const res = await fetch('/api/repos', { credentials: 'include' });
        const data = await res.json();
        allRepos = data.repos ?? [];
        renderRepos(allRepos);
      } catch (err) {
        repoList.innerHTML = '<div class="line error">Failed to load repos</div>';
      }

      searchInput.addEventListener('input', (e) => {
        const q = e.target.value.toLowerCase();
        renderRepos(allRepos.filter((r) => r.full_name.toLowerCase().includes(q)));
      });

      function renderRepos(repos) {
        repoList.innerHTML = repos.map((r) => `
          <div class="repo-item" data-owner="${r.owner.login}" data-name="${r.name}">
            <div class="name">${r.full_name}${r.private ? '<span class="private-badge">Private</span>' : ''}</div>
            <div class="meta">${r.description ?? 'No description'} • Updated ${timeAgo(r.updated_at)}</div>
          </div>
        `).join('');

        repoList.querySelectorAll('.repo-item').forEach((el) => {
          el.addEventListener('click', () => {
            startSession(el.dataset.owner, el.dataset.name);
          });
        });
      }

      // Load sessions
      try {
        const res = await fetch('/api/sessions', { credentials: 'include' });
        const data = await res.json();
        renderSessions(data.sessions ?? []);
      } catch {
        document.getElementById('session-list').innerHTML = '';
      }

      function renderSessions(sessions) {
        const list = document.getElementById('session-list');
        if (!sessions.length) {
          list.innerHTML = '<div style="color:#8b949e;font-size:0.875rem;">No sessions yet</div>';
          return;
        }
        list.innerHTML = sessions.map((s) => {
          const icon = s.status === 'done' ? '✅' : s.status === 'error' ? '❌' : s.status === 'running' ? '⏳' : '⏸️';
          return `
            <div class="session-item" data-id="${s.id}">
              <span class="session-icon">${icon}</span>
              <div class="session-info">
                <div class="prompt">${s.repo_owner}/${s.repo_name}</div>
                <div class="meta">${s.status} • ${timeAgo(new Date(s.created_at).toISOString())}</div>
              </div>
            </div>
          `;
        }).join('');

        list.querySelectorAll('.session-item').forEach((el) => {
          el.addEventListener('click', () => {
            reconnectSession(el.dataset.id);
          });
        });
      }
    }

    async function startSession(owner, name) {
      app.innerHTML = `
        <div class="setup-log" id="setup-log">
          <div class="line done">�� Starting commute session...</div>
          <div class="line pending">�� Importing ${owner}/${name}...</div>
        </div>
      `;

      const log = document.getElementById('setup-log');

      try {
        const res = await fetch('/api/sessions', {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            prompt: '', // User will type in terminal
            repo: { owner, name },
          }),
        });

        const data = await res.json();
        if (data.error) throw new Error(data.error);

        currentSession = data;

        log.innerHTML += `<div class="line done">✅ Session ready</div>`;
        setTimeout(() => renderTerminal(owner, name, data.sessionId, data.terminalUrl), 500);
      } catch (err) {
        log.innerHTML += `<div class="line error">❌ ${err.message}</div>`;
      }
    }

    async function reconnectSession(sessionId) {
      try {
        const res = await fetch(`/api/sessions/${sessionId}`, { credentials: 'include' });
        const data = await res.json();
        currentSession = { sessionId, ...data };
        renderTerminal(data.repo?.owner, data.repo?.name, sessionId, `/api/sessions/${sessionId}/terminal`);
      } catch (err) {
        app.innerHTML = `<div class="loading"><div class="line error">Failed to reconnect: ${err.message}</div></div>`;
      }
    }

    async function renderTerminal(owner, name, sessionId, terminalUrl) {
      app.innerHTML = `
        <div class="terminal-container">
          <div class="terminal-header">
            <span class="repo">${owner}/${name}</span>
            <div class="status">
              <span class="status-dot idle" id="status-dot"></span>
              <span id="status-text">Idle</span>
            </div>
          </div>
          <div id="terminal"></div>
          <div class="terminal-toolbar">
            <button class="toolbar-btn" data-key="Tab">Tab</button>
            <button class="toolbar-btn" data-key="Escape">Esc</button>
            <button class="toolbar-btn" data-key="ArrowUp">↑</button>
            <button class="toolbar-btn" data-key="ArrowDown">↓</button>
            <button class="toolbar-btn" data-key="ArrowLeft">←</button>
            <button class="toolbar-btn" data-key="ArrowRight">→</button>
            <button class="toolbar-btn" data-key="Control+c">Ctrl+C</button>
            <button class="toolbar-btn" id="pr-btn" style="margin-left:auto;background:#238636;border-color:#238636;">Create PR</button>
          </div>
        </div>
      `;

      // Load xterm.js dynamically
      const { Terminal } = await import('https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.mjs');
      const { SandboxAddon } = await import('https://cdn.jsdelivr.net/npm/@cloudflare/sandbox@latest/xterm.mjs');

      terminal = new Terminal({
        cursorBlink: true,
        fontSize: 14,
        fontFamily: '"SF Mono", Monaco, "Cascadia Code", monospace',
        theme: {
          background: '#0d1117',
          foreground: '#c9d1d9',
          cursor: '#58a6ff',
          selectionBackground: '#264f78',
          black: '#0d1117',
          red: '#f85149',
          green: '#3fb950',
          yellow: '#d29922',
          blue: '#58a6ff',
          magenta: '#bc8cff',
          cyan: '#39c5cf',
          white: '#c9d1d9',
        },
        cols: 80,
        rows: 24,
      });

      terminal.open(document.getElementById('terminal'));

      // Connect to Sandbox terminal
      const wsUrl = `${window.location.protocol === 'https:' ? 'wss' : 'ws'}://${window.location.host}${terminalUrl}`;

      // For now, use a simple WebSocket connection
      // Full SandboxAddon integration requires the addon to be built
      const ws = new WebSocket(wsUrl);
      ws.binaryType = 'arraybuffer';

      ws.onopen = () => {
        updateStatus('running');
      };

      ws.onmessage = (e) => {
        if (typeof e.data === 'string') {
          const msg = JSON.parse(e.data);
          if (msg.type === 'ready') {
            terminal.writeln('\\r\\n�� Connected to KimiFlare\\r\\n');
          } else if (msg.type === 'exit') {
            updateStatus('done');
          } else if (msg.type === 'error') {
            terminal.writeln(`\\r\\n❌ Error: ${msg.message}\\r\\n`);
            updateStatus('error');
          }
        } else {
          const decoder = new TextDecoder();
          terminal.write(decoder.decode(e.data));
        }
      };

      ws.onclose = () => {
        updateStatus('idle');
      };

      ws.onerror = () => {
        terminal.writeln('\\r\\n❌ Connection error\\r\\n');
        updateStatus('error');
      };

      // Send keystrokes
      terminal.onData((data) => {
        if (ws.readyState === WebSocket.OPEN) {
          ws.send(new TextEncoder().encode(data));
        }
      });

      // Toolbar buttons
      document.querySelectorAll('.toolbar-btn[data-key]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const key = btn.dataset.key;
          if (key === 'Control+c') {
            terminal.input('\x03', true);
          } else {
            terminal.input(JSON.stringify({ type: 'key', key }), true);
          }
        });
      });

      // PR button
      document.getElementById('pr-btn').addEventListener('click', async () => {
        terminal.writeln('\\r\\n�� Creating pull request...\\r\\n');
        try {
          const res = await fetch(`/api/sessions/${sessionId}/finalize`, {
            method: 'POST',
            credentials: 'include',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ summary: 'Changes from commute session', commitCount: 1 }),
          });
          const data = await res.json();
          if (data.prUrl) {
            terminal.writeln(`✅ PR created: ${data.prUrl}\\r\\n`);
          } else {
            terminal.writeln(`⚠️ ${data.status}\\r\\n`);
          }
        } catch (err) {
          terminal.writeln(`❌ ${err.message}\\r\\n`);
        }
      });
    }

    function updateStatus(status) {
      const dot = document.getElementById('status-dot');
      const text = document.getElementById('status-text');
      if (!dot || !text) return;
      dot.className = `status-dot ${status}`;
      text.textContent = status.charAt(0).toUpperCase() + status.slice(1);
    }

    function timeAgo(isoString) {
      const date = new Date(isoString);
      const seconds = Math.floor((Date.now() - date.getTime()) / 1000);
      if (seconds < 60) return 'just now';
      const minutes = Math.floor(seconds / 60);
      if (minutes < 60) return `${minutes}m ago`;
      const hours = Math.floor(minutes / 60);
      if (hours < 24) return `${hours}h ago`;
      const days = Math.floor(hours / 24);
      return `${days}d ago`;
    }

    // ── Init ──────────────────────────────────────────────────────────
    async function init() {
      try {
        const res = await fetch('/api/me', { credentials: 'include' });
        if (res.ok) {
          currentUser = await res.json();
          renderHome();
        } else {
          renderLanding();
        }
      } catch {
        renderLanding();
      }
    }

    init();
  </script>
</body>
</html>
